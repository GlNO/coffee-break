<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title> CoffeeBreak </title>


      <!-- FONTS -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
     

        <link href="https://fonts.googleapis.com/css2?family=Lacquer&display=swap" rel="stylesheet">



      <link rel="stylesheet" href="./css/style.css"> 

      


</head>
<body>

      <main>

         <header> 
            <nav class="navbar"> 
                  


                 <p> <a href="/" class="app-name"> coffee &lt;br&gt;</a> </p>

                  <!-- Header Items -->
                       
                       <div class="nav-links">
                            
                              <button id="settings-button" type="button">Hi  there! </button>
                              <a href="index.html"> Analytics </a>
                              <a href="index.html"> About </a>

                       </div>



                  <!-- Header Items  -->

            </nav>

         </header>
      

            <div class="timer-section">

                  <div class="welcome-overlay" id="welcome-overlay">
                      <div class="welcome-card" id="welcome-card">
                          <div class="receipt-header">
                              <span class="receipt-brand">coffee &lt;br&gt;</span>
                              <span class="receipt-subtitle">RECEIPT</span>
                          </div>

                          <div class="receipt-divider"></div>

                          <label class="receipt-label" for="customer-name"> Drink For</label>
                          <input id="customer-name" class="customer-name" type="text" placeholder="your name" maxlength="20" />

                          <div class="receipt-divider"></div>

                          <button class="qr-button" id="welcome-button" type="button" aria-label="Submit name">
                              <img src="./assets/images/receipt.png" alt="Receipt submission button" />
                          </button>
                      </div>
                  </div>

                  <div class="mode-selector" aria-label="Timer mode selector">
                      <button class="mode-button is-active" data-mode="focus" type="button">
                          <span class="mode-name">Pomodoro</span>
                       
                      </button>

                      <button class="mode-button" data-mode="shortBreak" type="button">
                          <span class="mode-name">Short Break</span>
                          
                      </button>

                      <button class="mode-button" data-mode="longBreak" type="button">
                          <span class="mode-name">Long Break</span>
                          
                      </button>
                  </div>

                  <div class="timer">  </div>
      
                  <button class="btn" id="start-button"> Start Brewing </button>

            </div>


            <footer> CoffeeBreak | @syd.cgb </footer>
   </main>
<script src="./js/script.js"></script>
</body>
</html>
